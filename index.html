<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>RideCare</title>
    <style>
        :root {
            --bg: #eef0ff;
            --fr: #111;
            --bar: #ffffff;
            --tx: #1b2250;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme=light]) {
                --bg: #0b0f1c;
                --bar: #1a2036;
                --tx: #dfe4ff
            }
        }

        :root[data-theme=dark] {
            --bg: #0b0f1c;
            --bar: #1a2036;
            --tx: #dfe4ff
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px);
            height: 100%
        }

        body {
            margin: 0;
            height: 100%;
            background: var(--bg);
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center
        }

        #bar {
            width: 100%;
            max-width: 410px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            color: var(--tx);
            font-size: 12px
        }

        #bar select {
            flex: 1;
            min-width: 0;
            font-size: 13px;
            padding: 5px 6px;
            border-radius: 8px;
            border: 1px solid #9aa3d6;
            background: var(--bar);
            color: var(--tx)
        }

        #wrap {
            flex: 1;
            min-height: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start
        }

        #ph {
            position: relative;
            width: 100%;
            height: 100%;
            background: #fff;
            overflow: hidden
        }

        iframe {
            border: 0;
            width: 100%;
            height: 100%;
            display: block
        }

        @media(min-width:520px) {
            #wrap {
                align-items: center
            }

            #ph {
                width: 390px;
                height: min(844px, calc(100% - 8px));
                border: 10px solid var(--fr);
                border-radius: 38px;
                box-sizing: border-box
            }
        }

        #toast {
            position: absolute;
            left: 12px;
            right: 12px;
            bottom: 84px;
            z-index: 9;
            background: #14182b;
            color: #fff;
            font-size: 13px;
            line-height: 1.35;
            padding: 10px 14px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, .3);
            opacity: 0;
            transform: translateY(8px);
            transition: .25s;
            pointer-events: none;
            text-align: center
        }

        #toast.on {
            opacity: 1;
            transform: none
        }
    </style>
</head>

<body>
    <div id="bar"><span>Xem nhanh màn hình:</span><select id="sel"></select></div>
    <div id="wrap">
        <div id="ph"><iframe id="f" title="RideCare"></iframe>
            <div id="toast"></div>
        </div>
    </div>

mary();\n      }\n    });\n\n    // 3. Distance Card Selector\n    const distanceCards = document.querySelectorAll('.distance-card');\n    const insightText = document.getElementById('smartInsightText');\n\n    distanceCards.forEach(card => {\n      card.addEventListener('click', () => {\n        distanceCards.forEach(c => {\n          c.classList.remove('bg-surface-container-high', 'shadow-sm', 'selected');\n          c.classList.add('bg-surface-container-low', 'shadow-xs');\n          const dotWrapper = c.querySelector('div:first-child');\n          const innerDot = c.querySelector('.inner-dot');\n          dotWrapper.className = 'w-6 h-6 rounded-full bg-surface-container flex items-center justify-center shrink-0';\n          innerDot.className = 'inner-dot w-2.5 h-2.5 rounded-full bg-transparent';\n          const title = c.querySelector('.font-title-md');\n          title.classList.remove('text-primary');\n          title.classList.add('text-on-surface');\n        });\n\n        card.classList.remove('bg-surface-container-low', 'shadow-xs');\n        card.classList.add('bg-surface-container-high', 'shadow-sm', 'selected');\n        const dotWrapper = card.querySelector('div:first-child');\n        const innerDot = card.querySelector('.inner-dot');\n        dotWrapper.className = 'w-6 h-6 rounded-full bg-primary flex items-center justify-center shrink-0';\n        innerDot.className = 'inner-dot w-2.5 h-2.5 rounded-full bg-on-primary';\n        const title = card.querySelector('.font-title-md');\n        title.classList.remove('text-on-surface');\n        title.classList.add('text-primary');\n\n        const val = card.dataset.distance;\n        if (val === 'under10') {\n          insightText.innerHTML = 'Dựa trên thói quen <strong class=\"text-on-surface font-bold\">~7 km/ngày<\/strong>, xe bạn sẽ cần thay nhớt sau khoảng <strong class=\"text-secondary font-bold\">90 ngày nữa<\/strong>.';\n        } else if (val === '10to30') {\n          insightText.innerHTML =  justify-center text-white shrink-0 shadow-sm\">\n<span class=\"material-symbols-outlined text-[22px]\" style=\"font-variation-settings: 'FILL' 1;\">recommend<\/span>\n<\/div>\n<div>\n<div class=\"flex items-center gap-2\">\n<span class=\"text-[18px] font-bold text-gray-900\">14.500<\/span>\n<span class=\"text-[13px] text-gray-500\">km<\/span>\n<span class=\"bg-[#fe6b00] text-white text-[11px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider\">\n              GỢI Ý CHUẨN\n            <\/span>\n<\/div>\n<p class=\"text-[13px] text-gray-500 mt-0.5\">Gần nhất với mức ước tính 14.250 km<\/p>\n<\/div>\n<\/div>\n<span class=\"check-icon opacity-100 material-symbols-outlined text-primary text-[24px]\" style=\"font-variation-settings: 'FILL' 1;\">check_circle<\/span>\n<\/button>\n<!-- Tier 3 Quick Option: 15,000 km -->\n<button class=\"odo-option-btn text-left p-4 rounded-2xl bg-white shadow-sm border border-gray-100 flex items-center justify-between active:scale-[0.99] transition-all\" onclick=\"selectOdoOption(this, 15000)\" type=\"button\">\n<div class=\"flex items-center gap-3.5\">\n<div class=\"w-11 h-11 rounded-full bg-blue-50 text-blue-900 flex items-center justify-center\">\n<span class=\"material-symbols-outlined text-[22px]\">add_circle_outline<\/span>\n<\/div>\n<div>\n<div class=\"text-[18px] font-bold text-gray-900 flex items-baseline gap-1\">\n<span>15.000<\/span>\n<span class=\"text-[13px] font-normal text-gray-500\">km<\/span>\n<\/div>\n<p class=\"text-[13px] text-gray-500 mt-0.5\">Nếu gần đây bạn đi phượt hoặc đi xa<\/p>\n<\/div>\n<\/div>\n<span class=\"check-icon opacity-0 material-symbols-outlined text-primary text-[24px]\">radio_button_checked<\/span>\n<\/button>\n<\/section>\n<!-- Alternative Input Methods (OCR Camera + Custom Input) -->\n<section class=\"flex flex-col gap-2.5 pt-1\">\n<div class=\"flex items-center justify-between\">\n<span class=\"text-[13px] font-bold text-gray-900 uppercase tracking-wider\">CÁCH CẬP NHẬT KHÁC<\/span>\n<\/d \n        lightbulb\n      <\/span>\n<p class=\"text-[13px] text-gray-600 leading-snug\">\n        Tại mốc <strong class=\"font-bold text-gray-800\">15.000 km<\/strong>, xe bạn sẽ đến chu kỳ kiểm tra dầu láp và vệ sinh nồi xe để ga mượt, tiết kiệm xăng.\n      <\/p>\n<\/div>\n<\/section>\n<!-- Action Area -->\n<footer class=\"pt-2 flex flex-col gap-2.5\">\n<!-- Primary CTA: Save & Sync -->\n<button class=\"w-full h-12 py-3 px-4 rounded-xl bg-primary text-white font-semibold active:scale-[0.98] transition-transform shadow-md flex items-center justify-center gap-2\" id=\"saveButton\" onclick=\"handleSaveOdo()\" type=\"button\">\n<span class=\"material-symbols-outlined text-[20px]\">sync<\/span>\n<span class=\"text-[15px] font-bold tracking-wide\">Lưu ODO &amp; Đồng bộ (14.500 km)<\/span>\n<\/button>\n<!-- Secondary CTA: Skip for now -->\n<button class=\"w-full h-12 py-3 px-4 rounded-xl bg-[#f0f3fe] active:bg-blue-100/70 transition-colors text-center flex items-center justify-center\" onclick=\"parent.postMessage({go:'back'},'*')\" type=\"button\">\n<span class=\"text-[15px] font-semibold text-gray-700\">Để sau<\/span>\n<\/button>\n<!-- Warm Delightful Microcopy Note -->\n<p class=\"text-[12px] text-gray-500 text-center px-4 leading-relaxed pt-1\">\n      Không sao cả, RideCare sẽ tự động cộng dồn km theo thói quen của bạn.\n    <\/p>\n<\/footer>\n<\/div>\n<script>\n  let currentOdo = 14500;\n\n  function selectOdoOption(element, value) {\n    currentOdo = value;\n    const inputEl = document.getElementById('manualOdoInput');\n    if (inputEl) {\n      inputEl.value = value;\n    }\n\n    // Reset visual styles of options\n    document.querySelectorAll('.odo-option-btn').forEach(btn => {\n      btn.classList.remove('bg-[#f2f5ff]', 'border-primary/20');\n      btn.classList.add('bg-white', 'border-gray-100');\n      const icon = btn.querySelector('.check-icon');\n      if (icon) {\n        icon.classList.remove('opacity-100');\n        icon.classList.add('opacity-0');\n        icon.innerText = 'radio_button_checked';\n        icon.style.fontVariationSettings = \"'FILL' 0\";\n      }\n    });\n\n    // Highlight selected card\n    element.classList.remove('bg-white', 'border-gray-100');\n    element.classList.add('bg-[#f2f5ff]', 'border-primary/20');\n    const selectedIcon = element.querySelector('.check-icon');\n    if (selectedIcon) {\n      selectedIcon.classList.remove('opacity-0');\n      selectedIcon.classList.add('opacity-100');\n      selectedIcon.innerText = 'check_circle';\n      selectedIcon.style.fontVariationSettings = \"'FILL' 1\";\n    }\n\n    updateSaveButtonText(value);\n  }\n\n  function handleCustomInput(val) {\n    const num = parseInt(val, 10);\n    if (!isNaN(num) && num > 0) {\n      currentOdo = num;\n      // Deselect quick radio buttons visually if not exact match\n      document.querySelectorAll('.odo-option-btn').forEach(btn => {\n        btn.classList.remove('bg-[#f2f5ff]', 'border-primary/20');\n        btn.classList.add('bg-white', 'border-gray-100');\n        const icon = btn.querySelector('.check-icon');\n        if (icon) {\n          icon.classList.remove('opacity-100');\n          icon.classList.add('opacity-0');\n        }\n      });\n      updateSaveButtonText(num);\n    }\n  }\n\n  function updateSaveButtonText(num) {\n    const btn = document.getElementById('saveButton');\n    if (btn) {\n      const formatted = new Intl.NumberFormat('vi-VN').format(num);\n      const textSpan = btn.querySelector('span:last-child');\n      if (textSpan) {\n        textSpan.textContent = `Lưu ODO & Đồng bộ (${formatted} km)`;\n      }\n    }\n  }\n\n  function triggerOcrCamera() {\n    const promptInput = prompt('Mô phỏng quét camera AI: Nhập số km nhận diện được từ đồng hồ', '14285');\n    if (promptInput) {\n      const num = parseInt(promptInput, 10);\n      if (!isNaN(num) && num > 0) {\n        const inputEl = document.getElementById('manualOdoInput');\n        if (inputEl) inputEl.value = num;\n
